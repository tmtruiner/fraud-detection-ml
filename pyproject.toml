[project]
name = "fraudp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tmtruiner", email = "keeptrng@mail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[project.scripts]
fraudp = "fraudp:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
